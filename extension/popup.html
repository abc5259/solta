<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #24292f;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #24292f;
            font-size: 14px;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }
        .btn {
            background: #0969da;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background: #0858b9;
        }
        .btn:active {
            background: #0747a6;
        }
        .status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .status.success {
            background: #dafbe1;
            color: #1a7f37;
            border: 1px solid #a3f3bf;
        }
        .status.error {
            background: #ffebe9;
            color: #cf222e;
            border: 1px solid #ff8182;
        }
        .info {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #57606a;
        }
        .info h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #24292f;
        }
        .info ul {
            margin: 0;
            padding-left: 16px;
        }
        .info li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Baekjoon Solve Timer</h1>
    </div>
    
    <div class="info">
        <h3>사용법</h3>
        <ul>
            <li>백준 문제 페이지에서 "시간 측정 시작" 버튼을 클릭</li>
            <li>문제를 풀고 제출</li>
            <li>맞았을 때 모달이 나타나면 "저장하기" 클릭</li>
            <li>풀이 기록이 Solta에 자동 저장됩니다</li>
        </ul>
    </div>
    
    <form id="settingsForm">
        <div class="form-group">
            <label for="serverUrl">Solta 서버 URL:</label>
            <input type="url" id="serverUrl" placeholder="http://localhost:8080" required>
        </div>
        
        <div class="form-group">
            <label for="bojUserId">백준 사용자 ID:</label>
            <input type="text" id="bojUserId" placeholder="your_boj_id" required>
        </div>
        
        <button type="submit" class="btn">설정 저장</button>
    </form>
    
    <div id="status" class="status" style="display: none;"></div>
    
    <script src="popup.js"></script>
</body>
</html>
