<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 320px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0;
            font-size: 18px;
            color: #24292f;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #24292f;
            font-size: 14px;
        }
        input[type="text"], input[type="url"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        input[type="text"]:focus, input[type="url"]:focus {
            outline: none;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.1);
        }
        .btn {
            background: #0969da;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background: #0858b9;
        }
        .btn:active {
            background: #0747a6;
        }
        .status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }
        .status.success {
            background: #dafbe1;
            color: #1a7f37;
            border: 1px solid #a3f3bf;
        }
        .status.error {
            background: #ffebe9;
            color: #cf222e;
            border: 1px solid #ff8182;
        }
        .info {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
            color: #57606a;
        }
        .info h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #24292f;
        }
        .info ul {
            margin: 0;
            padding-left: 16px;
        }
        .info li {
            margin-bottom: 4px;
        }
        .login-section {
            margin-bottom: 20px;
            padding: 16px;
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
        }
        .login-section h2 {
            margin: 0 0 12px 0;
            font-size: 16px;
            color: #24292f;
        }
        .github-btn {
            background: #24292f;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .github-btn:hover {
            background: #1b1f23;
        }
        .github-btn:active {
            background: #0d1117;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }
        .user-details {
            flex: 1;
        }
        .user-details .name {
            font-weight: 600;
            color: #24292f;
            font-size: 14px;
        }
        .user-details .username {
            color: #57606a;
            font-size: 13px;
        }
        .logout-btn {
            background: #fff;
            color: #cf222e;
            border: 1px solid #d0d7de;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background: #ffebe9;
            border-color: #ff8182;
        }
        .settings-section {
            display: none;
        }
        .settings-section.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Baekjoon Solve Timer</h1>
    </div>

    <!-- GitHub 로그인 섹션 -->
    <div class="login-section">
        <h2>로그인</h2>

        <!-- 로그인 전 -->
        <div id="loginView">
            <button id="githubLoginBtn" class="github-btn">
                <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                GitHub로 로그인
            </button>
        </div>

        <!-- 로그인 후 -->
        <div id="loggedInView" style="display: none;">
            <div class="user-info">
                <img id="userAvatar" src="" alt="User Avatar">
                <div class="user-details">
                    <div class="name" id="userName"></div>
                    <div class="username" id="userLogin"></div>
                </div>
                <button id="logoutBtn" class="logout-btn">로그아웃</button>
            </div>
        </div>
    </div>

    <!-- 사용법 섹션 -->
    <div class="settings-section" id="settingsSection">
        <div class="info">
            <h3>사용법</h3>
            <ul>
                <li>백준 문제 페이지에서 "시간 측정 시작" 버튼을 클릭</li>
                <li>문제를 풀고 제출</li>
                <li>맞았을 때 모달이 나타나면 "저장하기" 클릭</li>
                <li>풀이 기록이 Solta에 자동 저장됩니다</li>
            </ul>
        </div>
    </div>

    <div id="status" class="status" style="display: none;"></div>

    <script type="module" src="popup.js"></script>
</body>
</html>
